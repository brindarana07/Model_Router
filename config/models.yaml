models:
  - name: fast-small
    provider: openai
    model_id: gpt-4o-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 0.0002
    cost_per_1k_output: 0.0008
    max_context: 128000
    tier: easy
    timeout_seconds: 45
    max_retries: 1

  - name: local
    provider: ollama
    model_id: llama3.2
    api_base: http://localhost:11434
    cost_per_1k_input: 0
    cost_per_1k_output: 0
    max_context: 128000
    tier: easy
    timeout_seconds: 120

  - name: strong-large
    provider: anthropic
    model_id: claude-3-5-sonnet-latest
    api_base: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.01
    max_context: 128000
    tier: hard
    timeout_seconds: 90
    max_retries: 1

  - name: gemini-flash
    provider: gemini
    model_id: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
    max_context: 128000
    tier: fast
    timeout_seconds: 90
    max_retries: 1

  - name: groq-fast
    provider: groq
    model_id: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    max_context: 128000
    tier: fast
    timeout_seconds: 45
    max_retries: 1

routing:
  strategy: rules
  default: groq-fast
  fallbacks: [gemini-flash]
  rules:
    - if:
        has_image: true
      use: gemini-flash
    - if:
        input_tokens_gt: 8000
      use: gemini-flash
    - if:
        has_code: true
      use: gemini-flash
    - if:
        query_contains_any:
          - analyze
          - analyse
          - compare
          - step by step
          - in detail
          - reason through
          - architecture
          - debug
          - refactor
          - write code
          - write a script
          - python
          - javascript
          - sql
      use: gemini-flash