models:
  - name: fast-small
    provider: openai
    model_id: gpt-4o-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 0.0002
    cost_per_1k_output: 0.0008
    max_context: 128000
    tier: easy
    timeout_seconds: 45
    max_retries: 1

  - name: local
    provider: ollama
    model_id: llama3.2
    api_base: http://localhost:11434
    cost_per_1k_input: 0
    cost_per_1k_output: 0
    max_context: 128000
    tier: easy
    timeout_seconds: 120

  - name: strong-large
    provider: anthropic
    model_id: claude-3-5-sonnet-latest
    api_base: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.01
    max_context: 128000
    tier: hard
    timeout_seconds: 90
    max_retries: 1

routing:
  strategy: rules
  default: fast-small
  fallbacks: [local, strong-large]
  rules:
    - if:
        has_image: true
      use: fast-small
    - if:
        input_tokens_gt: 50000
      use: strong-large
    - if:
        has_code: true
      use: strong-large