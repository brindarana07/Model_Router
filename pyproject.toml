[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.1.0"
description = "A config-driven OpenAI-compatible LLM model router."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]